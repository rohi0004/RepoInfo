services:
  - type: web
    name: repoinfo
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://repoinfo.onrender.com
      - key: MONGODB_URI
        fromDatabase:
          name: repoinfo-mongodb
          property: connectionString
      - key: MONGODB_DB_NAME
        value: repoinfo
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: repoinfo-redis
          property: connectionString

  - type: redis
    name: repoinfo-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: repoinfo-mongodb
    databaseName: repoinfo
    user: repoinfo
    plan: free
    region: oregon
