version: "3.9"

services:
  app:
    build: .
    image: repomind:dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - ./:/app:cached
      - /app/node_modules
    working_dir: /app
    command: sh -lc "npm install --no-audit --no-fund && npm run dev"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/repoinfo
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=repoinfo

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
