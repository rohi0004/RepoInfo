services:
  - type: web
    name: repoinfo
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://repoinfo.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: KV_URL
        sync: false
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
      - key: KV_REST_API_READ_ONLY_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false

  - type: redis
    name: repoinfo-redis
    plan: free
    region: oregon
    ipAllowList: []
