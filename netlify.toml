[build]
  # Force clean install with devDependencies (tailwindcss, postcss, autoprefixer)
  command = "rm -rf .next node_modules && npm install --include=dev && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.9.0"
  NODE_ENV = "production"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Enable Next.js plugin (auto-configured)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Function configuration
[functions]
  # Increase timeout for API routes (max 26 seconds on free tier)
  # Pro tier allows up to 60 seconds
  node_bundler = "esbuild"

