[build]
  # Run a clean install, then list Tailwind-related packages to aid debugging,
  # then build. The `ls` output will appear in Netlify logs so we can verify
  # whether `tailwindcss` and `@tailwindcss/typography` were installed.
  command = "rm -rf .next && npm ci && ls -la node_modules/tailwindcss || true && ls -la node_modules/@tailwindcss || true && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.9.0"
  NODE_ENV = "production"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Enable Next.js plugin (auto-configured)
[[plugins]]
  package = "@netlify/plugin-nextjs"

