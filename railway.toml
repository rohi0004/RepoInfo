[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.render"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "repoinfo"

[services.env]
NODE_ENV = "production"
MONGODB_DB_NAME = "repoinfo"

[[services]]
name = "mongodb"
